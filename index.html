<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
/* ── 移動平均 ── */
function calcMA(closes, period) {
  return closes.map((_, i) => {
    if (i < period - 1) return null;
    let s = 0;
    for (let k = i - period + 1; k <= i; k++) s += closes[k];
    return +(s / period).toFixed(1);
  });
}

/* ── RSI (Wilder 平滑) ── */
function calcRSI(closes, period) {
  const result = new Array(closes.length).fill(null);
  if (closes.length <= period) return result;
  let gainSum = 0, lossSum = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i - 1];
    if (d > 0) gainSum += d; else lossSum -= d;
  }
  let avgGain = gainSum / period;
  let avgLoss = lossSum / period;
  result[period] = avgLoss === 0 ? 100 : +(100 - 100 / (1 + avgGain / avgLoss)).toFixed(2);
  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    avgGain = (avgGain * (period - 1) + Math.max(d, 0)) / period;
    avgLoss = (avgLoss * (period - 1) + Math.max(-d, 0)) / period;
    result[i] = avgLoss === 0 ? 100 : +(100 - 100 / (1 + avgGain / avgLoss)).toFixed(2);
  }
  return result;
}

/* ── ATR (Wilder 平滑) ── */
function calcATR(data, period = 14) {
  // data 升序，欄位使用 max/min/close
  const tr = new Array(data.length).fill(null);
  for (let i = 1; i < data.length; i++) {
    const h = data[i].max, l = data[i].min, pc = data[i - 1].close;
    tr[i] = Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc));
  }
  const result = new Array(data.length).fill(null);
  const seed = period;
  if (seed >= data.length) return result;
  let sum = 0;
  for (let i = 1; i <= period; i++) {
    if (tr[i] === null) return result;
    sum += tr[i];
  }
  result[seed] = +(sum / period).toFixed(1);
  for (let i = seed + 1; i < data.length; i++) {
    if (tr[i] === null) continue;
    result[i] = +((result[i - 1] * (period - 1) + tr[i]) / period).toFixed(1);
  }
  return result;
}

/* ── 布林通道 (period=20, multiplier=2) ── */
function calcBBands(closes, period = 20, mult = 2) {
  const upper = [], lower = [];
  for (let i = 0; i < closes.length; i++) {
    if (i < period - 1) { upper.push(null); lower.push(null); continue; }
    const slice = closes.slice(i - period + 1, i + 1);
    const mean  = slice.reduce((a, b) => a + b, 0) / period;
    const std   = Math.sqrt(slice.reduce((a, b) => a + (b - mean) ** 2, 0) / period);
    upper.push(+(mean + mult * std).toFixed(1));
    lower.push(+(mean - mult * std).toFixed(1));
  }
  return { upper, lower };
}

/* ── Nadaraya-Watson 核回歸 (Gaussian kernel, bandwidth=h) ──
   Causal（非重繪）版本：j 只走訪 0 ~ i，不使用未來資料
   nw[i] = Σ_{j=0}^{i} K((i-j)/h)·close[j] / Σ_{j=0}^{i} K((i-j)/h)
   K(u) = exp(-0.5·u²)                                                 */
function calcNWKernel(closes, h = 8.0) {
  const n = closes.length;
  const result = new Array(n);
  for (let i = 0; i < n; i++) {
    let sumW = 0, sumWY = 0;
    for (let j = 0; j <= i; j++) {       // ← 只看 0 ~ i，不偷看未來
      const d = (i - j) / h;
      const w = Math.exp(-0.5 * d * d);
      sumW  += w;
      sumWY += w * closes[j];
    }
    result[i] = +(sumWY / sumW).toFixed(1);
  }
  return result;
}

/* ── ADX (Wilder 平滑, period=14) ── */
function calcADX(data, period = 14) {
  const n = data.length;
  const result = new Array(n).fill(null);
  if (n < 2 * period + 1) return result;

  const tr = [], pdm = [], mdm = [];

  for (let i = 1; i < n; i++) {
    const h = data[i].max,  l = data[i].min;
    const ph = data[i-1].max, pl = data[i-1].min, pc = data[i-1].close;
    tr.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
    const up = h - ph, dn = pl - l;
    pdm.push(up > dn && up > 0 ? up : 0);
    mdm.push(dn > up && dn > 0 ? dn : 0);
  }

  // 初始 Wilder 平滑 (前 period 項之和)
  let sTR  = 0, sPDM = 0, sMDM = 0;
  for (let i = 0; i < period; i++) { sTR += tr[i]; sPDM += pdm[i]; sMDM += mdm[i]; }

  const dx = [];
  for (let i = period; i < tr.length; i++) {
    sTR  = sTR  - sTR  / period + tr[i];
    sPDM = sPDM - sPDM / period + pdm[i];
    sMDM = sMDM - sMDM / period + mdm[i];
    const pdi = 100 * sPDM / sTR;
    const mdi = 100 * sMDM / sTR;
    const sum = pdi + mdi;
    dx.push(sum === 0 ? 0 : 100 * Math.abs(pdi - mdi) / sum);
  }

  if (dx.length < period) return result;

  // 第一個 ADX = 前 period 個 DX 的平均
  let adxVal = 0;
  for (let i = 0; i < period; i++) adxVal += dx[i];
  adxVal /= period;

  // dx[0] 對應 data[period+1]，dx[period-1] 對應 data[2*period]
  result[2 * period] = +adxVal.toFixed(2);

  for (let i = period; i < dx.length; i++) {
    adxVal = (adxVal * (period - 1) + dx[i]) / period;
    result[2 * period + (i - period + 1)] = +adxVal.toFixed(2);
  }

  return result;
}

/* ── 數字格式化 ── */
function fmt(n) {
  if (n === null || n === undefined) return '-';
  return n.toLocaleString();
}

/* ── 主程式 ── */
async function main() {

  //   contract_date: string  // ex: "200404"
  //   open:          number  // 開盤價
  //   max:           number  // 最高價
  //   min:           number  // 最低價
  //   close:         number  // 收盤價
  //   volume:        number  // 成交量
  // }[]
  const [priceRes, reportRes] = await Promise.all([
    fetch('./day_data/stocks.ftx.json'),
    fetch('./strategy6-16_report.json')

  const closes  = data.map(d => d.close);
  const volumes = data.map(d => d.volume);

  const candles = data.map(d => [d.open, d.close, d.min, d.max]);

    value: d.volume,
    itemStyle: { color: d.close >= d.open ? '#ef5350' : '#26a69a' }

  const ma5   = calcMA(closes, 5);
  const ma11  = calcMA(closes, 11);
  const ma20  = calcMA(closes, 20);
  const ma60  = calcMA(closes, 60);
  const ma180 = calcMA(closes, 180);
  const ma200 = calcMA(closes, 200);
  const ma240 = calcMA(closes, 240);
  const adx  = calcADX(data, 14);
  const bb   = calcBBands(closes, 20, 2);
  const atr  = calcATR(data, 14);
  const rsi7  = calcRSI(closes, 7);
  const rsi14 = calcRSI(closes, 14);
  // 每根 K 棒收盤 - 1.5 × ATR(14)，作為動態停損參考線
  const atrStop = closes.map((c, i) =>
    atr[i] !== null ? +(c - 1.5 * atr[i]).toFixed(1) : null
  );

  // NW Kernel Regression Envelope（初始值，可由畫面控制）
  let nwH    = parseFloat(document.getElementById('inp-nwH').value)    || 5.2;
  let nwMult = parseFloat(document.getElementById('inp-nwMult').value) || 3;

  function buildNWSeries(h, mult) {
    const mean  = calcNWKernel(closes, h);
    const upper = mean.map((v, i) => atr[i] !== null ? +(v + mult * atr[i]).toFixed(1) : null);
    const lower = mean.map((v, i) => atr[i] !== null ? +(v - mult * atr[i]).toFixed(1) : null);
    return { mean, upper, lower };
  }

  let nw = buildNWSeries(nwH, nwMult);
  const nwMean  = nw.mean;
  const nwUpper = nw.upper;
  const nwLower = nw.lower;

  // 成交量 MA
  const volMA5  = calcMA(volumes, 5);
  const volMA10 = calcMA(volumes, 10);
  const volMA20 = calcMA(volumes, 20);
  // Volume Ratio = 當日量 ÷ 過去 20 日平均量
  const volRatio = volumes.map((v, i) =>
    volMA20[i] !== null && volMA20[i] !== 0
      ? +((v / volMA20[i]).toFixed(2))
      : null
  );

  // 交易標記
  const dateIndex = Object.fromEntries(dates.map((d, i) => [d, i]));

  const entryScatter = trades
    .filter(t => dateIndex[t.entryDate] !== undefined)
    .map(t => ({
      value: [t.entryDate, t.entryPrice],
      tradeId: t.id,
      exitDate: t.exitDate,
      exitPrice: t.exitPrice,
      pnlPoints: t.pnlPoints,
      pnl: t.pnl,
      cumulativePnl: t.cumulativePnl,
      exitReason: t.exitReason,
      itemStyle: { color: t.pnlPoints >= 0 ? '#ef5350' : '#26a69a' }
    }));

  const exitScatter = trades
    .filter(t => dateIndex[t.exitDate] !== undefined)
    .map(t => ({
      value: [t.exitDate, t.exitPrice],
      tradeId: t.id,
      entryDate: t.entryDate,
      entryPrice: t.entryPrice,
      pnlPoints: t.pnlPoints,
      pnl: t.pnl,
      cumulativePnl: t.cumulativePnl,
      exitReason: t.exitReason,
      itemStyle: { color: t.pnlPoints >= 0 ? '#ef5350' : '#26a69a' }
    }));

  // 累積損益對齊至 exitDate
  const cumPnlData = new Array(dates.length).fill(null);
  trades.forEach(t => {
    const idx = dateIndex[t.exitDate];
    if (idx !== undefined) cumPnlData[idx] = t.cumulativePnl;
  });

  // BBW = (上軌 − 下軌) ÷ 中軌 (中軌 = MA20)
  const bbw  = bb.upper.map((u, i) => {
    const l = bb.lower[i], m = ma20[i];
    return (u !== null && l !== null && m !== null && m !== 0)
      ? +((u - l) / m * 100).toFixed(3)
      : null;
  });

  document.getElementById('loading').style.display = 'none';
  const mainEl = document.getElementById('main');
  mainEl.style.display = 'block';

  const chart = echarts.init(mainEl, null, { renderer: 'canvas' });

  // 預設顯示最近 150 根
  const showBars  = 150;

  const option = {
    backgroundColor: '#0d1117',
    animation: false,

    legend: {

      data: [

        { name: 'NW 中軸',    icon: 'line' },

        { name: 'VR',       icon: 'line' },
        { name: 'ADX(14)',  icon: 'line' },
        { name: 'BBW(%)',   icon: 'line' },
        { name: 'ATR(14)',  icon: 'line' },
        { name: 'ATR Stop', icon: 'line' },
        { name: 'RSI(7)',   icon: 'line' },
        { name: 'RSI(14)',  icon: 'line' },
        { name: '進場',     icon: 'circle' },

      formatter(params) {
        if (!params || !params.length) return '';
        const date = params[0].axisValue;
        let html = `<div style="margin-bottom:4px;font-weight:bold;color:#58a6ff">${date}</div>`;
        params.forEach(p => {
          if (p.seriesName === 'K線') {
            // p.value = [xAxisIndex, open, close, low, high]（ECharts 自動在首位插入 x 軸索引）
            const [, o, c, l, h] = p.value;
            const clr = c >= o ? '#ef5350' : '#26a69a';
            html += `<span style="color:${clr}">▮</span> 開 <b>${fmt(o)}</b>　高 <b>${fmt(h)}</b>　低 <b>${fmt(l)}</b>　收 <b>${fmt(c)}</b><br/>`;
          } else if (p.seriesName === 'BB上軌' || p.seriesName === 'BB下軌') {
            if (p.value !== null && p.value !== undefined)
              html += `<span style="color:${p.color}">─ ─</span> ${p.seriesName}: <b>${fmt(p.value)}</b><br/>`;
          } else if (p.seriesName === 'NW 中軸' || p.seriesName === 'NW 上軌' || p.seriesName === 'NW 下軌') {
            if (p.value !== null && p.value !== undefined)
              html += `<span style="color:${p.color}">─</span> ${p.seriesName}: <b>${fmt(p.value)}</b><br/>`;
          } else if (p.seriesName === 'BBW(%)') {
            if (p.value !== null && p.value !== undefined)
              html += `<span style="color:${p.color}">─</span> BBW: <b>${p.value}%</b><br/>`;
          } else if (p.seriesName === 'VR') {
            if (p.value !== null && p.value !== undefined)
              html += `<span style="color:${p.color}">─</span> VR: <b>${p.value}</b><br/>`;
          } else if (p.seriesName === '進場') {
            const d = p.data;
            if (d) {
              const clr = d.pnlPoints >= 0 ? '#ef5350' : '#26a69a';
              html += `<span style="color:${clr}">▲</span> 進場 #${d.tradeId}: <b>${fmt(d.value[1])}</b> → 出場 ${d.exitDate} <b>${fmt(d.exitPrice)}</b>`;
              html += ` | <b style="color:${clr}">${d.pnlPoints >= 0 ? '+' : ''}${d.pnlPoints}pt</b> ${d.exitReason}<br/>`;
            }
          } else if (p.seriesName === '出場') {
            const d = p.data;
            if (d) {
              const clr = d.pnlPoints >= 0 ? '#ef5350' : '#26a69a';
              html += `<span style="color:${clr}">▼</span> 出場 #${d.tradeId}: <b>${fmt(d.value[1])}</b> | 累積: <b style="color:${clr}">${d.cumulativePnl >= 0 ? '+' : ''}${fmt(d.cumulativePnl)}</b><br/>`;
            }
          } else if (p.seriesName === '累積損益') {
            if (p.value !== null && p.value !== undefined) {
              const clr = p.value >= 0 ? '#ef5350' : '#26a69a';
              html += `<span style="color:${clr}">─</span> 累積損益: <b style="color:${clr}">${p.value >= 0 ? '+' : ''}${fmt(p.value)}</b><br/>`;
            }

            html += `<span style="color:${p.color}">▮</span> 成交量: <b>${fmt(p.value)}</b><br/>`;
          } else if (p.value !== null && p.value !== undefined) {
            html += `<span style="color:${p.color}">─</span> ${p.seriesName}: <b>${p.value}</b><br/>`;
          }
        });
        return html;
      }
    },

  // ── NW 參數即時更新 ──
  function applyNW() {
    const h    = parseFloat(document.getElementById('inp-nwH').value);
    const mult = parseFloat(document.getElementById('inp-nwMult').value);
    if (isNaN(h) || isNaN(mult) || h <= 0 || mult <= 0) return;
    const nwNew = buildNWSeries(h, mult);
    chart.setOption({
      series: [
        { name: '_nw_base', data: nwNew.lower },
        {
          name: '_nw_fill',
          data: nwNew.upper.map((u, i) =>
            u !== null && nwNew.lower[i] !== null ? +(u - nwNew.lower[i]).toFixed(1) : null
          )
        },
        { name: 'NW 中軸', data: nwNew.mean },
        { name: 'NW 上軌', data: nwNew.upper },
        { name: 'NW 下軌', data: nwNew.lower },
      ]
    });
  }
  document.getElementById('inp-nwH').addEventListener('input', applyNW);
  document.getElementById('inp-nwMult').addEventListener('input', applyNW);
}

main().catch(err => {
  document.getElementById('loading').innerHTML =
    `<div style="color:#f85149">⚠ 載入失敗：${err.message}</div>
     <div style="color:#666;font-size:13px;margin-top:8px">請確認透過本機伺服器開啟此頁面</div>`;
});
